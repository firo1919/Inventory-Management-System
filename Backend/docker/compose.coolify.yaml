# This is coolify specific compose setup for deployment
services:
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
        environment:
            - SPRING_DATASOURCE_PASSWORD
            - SPRING_DATASOURCE_URL
            - SPRING_DATASOURCE_USERNAME
            - SPRING_MAIL_USERNAME
            - SPRING_MAIL_PASSWORD
            - ADMIN_FIRSTNAME
            - ADMIN_LASTNAME
            - ADMIN_USERNAME
            - ADMIN_PASSWORD
            - ADMIN_EMAIL
            - ADMIN_PHONE
            - AUTH_SECRET

        image: firo1919/inventory
        restart: unless-stopped
