spring.application.name=inventory
spring.datasource.driver-class-name=org.postgresql.Driver

# cache
spring.cache.type=redis
cache.ttl.products=5
cache.ttl.low-stock=5
cache.ttl.inventory-value=10
cache.ttl.categories=30

# swagger
springdoc.swagger-ui.path=/docs

management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# Health indicators
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.ping.enabled=true

info.app.name=Inventory Management System
info.app.description=A simple inventory management system built with Spring Boot and PostgreSQL.
info.app.version=1.0.0
info.app.author=Firomsa Assefa