services:
    app:
        build:
            context: ./
            dockerfile: Dockerfile.dev
        environment:
            - SPRING_DATASOURCE_PASSWORD
            - SPRING_DATASOURCE_URL
            - SPRING_DATASOURCE_USERNAME
            - SPRING_MAIL_USERNAME
            - SPRING_MAIL_PASSWORD
            - SPRING_MAIL_HOST
            - SPRING_MAIL_PORT
            - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH
            - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
            - ADMIN_FIRSTNAME
            - ADMIN_LASTNAME
            - ADMIN_USERNAME
            - ADMIN_PASSWORD
            - ADMIN_EMAIL
            - ADMIN_PHONE
            - AUTH_SECRET
        ports:
            - 8080:8080
        container_name: inventory_app
        image: inventory:dev
        volumes:
            - ./src:/app/src
            - ./pom.xml:/app/pom.xml
        restart: unless-stopped
        depends_on:
            - mailhog
            - sql-studio
    
    sql-studio:
        image: frectonz/sql-studio:latest
        container_name: sqlstudio_app
        depends_on:
          postgres:
                condition: service_healthy
        ports:
          - "3030:3030"
        command: >
          /bin/sql-studio
          --no-browser
          --no-shutdown
          --address=0.0.0.0:3030
          postgres
          postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB
          
    postgres:
        image: "postgres:18"
        environment:
            - POSTGRES_DB
            - POSTGRES_PASSWORD
            - POSTGRES_USER
        volumes:
            - inventory_db_data:/var/lib/postgresql/18/data
        ports:
            - 5432
        container_name: inventory_postgres_db
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
    
    mailhog:
        image: mailhog/mailhog:latest
        container_name: inventory_mailhog_app
        ports:
            - 1025:1025
            - 8025:8025

volumes:
    inventory_db_data:
